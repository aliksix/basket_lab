name: Publikacja portalu

# Portal to statyczne pliki w katalogu docs/ - wystarczy je wystawic.
# Odswiezanie danych jest osobnym zadaniem (refresh.yml), zeby publikacja
# nie zalezala od dostepnosci serwisow zrodlowych.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement wlacza Pages przez API przy pierwszym uruchomieniu,
      # zeby nie trzeba bylo tego klikac w ustawieniach repozytorium
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
